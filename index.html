<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的主页</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(160deg,#ffffff 0%,#fff5f9 50%,#ffe4ee 100%);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:16px 0 40px;color:#3a2c32}

.phone-container{max-width:480px;width:100%;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 8px 40px rgba(255,150,180,.18);border:1px solid #ffe4ee;margin:0 auto;position:relative}

.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;background:#fff;border-bottom:1px solid #fff0f5}
.top-bar .username{font-size:19px;font-weight:700;display:flex;align-items:center;gap:6px;color:#c96a8e}
.top-bar .username i{font-size:14px;color:#ffb6d5}
.top-bar .icons{display:flex;gap:20px;font-size:19px;color:#e28fb0}
.top-bar .icons i{cursor:pointer}

.banner{height:100px;background:linear-gradient(135deg,#ffd6e5,#ffb6d5,#ff9ec4);position:relative;overflow:hidden}
.banner::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.6),transparent 60%)}

.profile-section{display:flex;padding:0 16px 12px;gap:16px;align-items:flex-end;margin-top:-42px;position:relative;z-index:2}
.avatar-container{position:relative;width:88px;height:88px;flex-shrink:0}
.avatar{width:100%;height:100%;border-radius:50%;background:#fff;padding:3px;cursor:pointer;transition:transform .2s;box-shadow:0 4px 16px rgba(255,150,180,.3)}
.avatar:active{transform:scale(.95)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #fff;background:#fff0f5;display:block}
.avatar-overlay{position:absolute;bottom:0;right:0;width:28px;height:28px;background:linear-gradient(135deg,#ff8fb8,#ff6ea3);border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;color:#fff;font-size:11px;box-shadow:0 2px 8px rgba(255,110,163,.35)}

.profile-info{flex:1;padding-bottom:4px}
.display-name{font-weight:800;font-size:16px;display:flex;align-items:center;gap:5px;color:#8a3c5e;margin-bottom:2px}
.display-name i{font-size:12px;color:#ff6ea3}
.handle{font-size:12px;color:#c5869f;margin-bottom:8px}

.stats{display:flex;gap:18px;font-size:12px;color:#a14a6e}
.stats b{font-size:14px;color:#8a3c5e;font-weight:800}

.editable-bio{padding:6px 16px 14px;font-size:13.5px;line-height:1.55;color:#7a4a5e;border-bottom:1px solid #fff0f5}
.bio-text{word-break:break-word}

.doc-link-box{margin:12px 16px;padding:12px 14px;background:linear-gradient(135deg,#fff5f9,#ffeaf3);border-radius:14px;border:1px dashed #ffb6d5;display:flex;align-items:center;gap:10px}
.doc-link-box i{color:#ff6ea3;font-size:18px}
.doc-link-box a{flex:1;color:#c96a8e;text-decoration:none;font-weight:700;font-size:13.5px;word-break:break-all}

.action-buttons{display:flex;gap:8px;padding:6px 16px 14px}
.btn{flex:1;background:linear-gradient(135deg,#ff9ec4,#ff6ea3);border:none;border-radius:22px;padding:10px 0;font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(255,110,163,.28)}
.btn:active{transform:scale(.96)}
.btn.outline{background:#fff;color:#ff6ea3;border:1.5px solid #ffd6e5;box-shadow:none}

.section-title{padding:12px 16px 6px;font-size:14px;font-weight:700;color:#8a3c5e;display:flex;align-items:center;gap:6px}
.section-title i{color:#ff9ec4;font-size:13px}

.post{background:#fff;margin:8px 12px;border-radius:16px;padding:16px;border:1px solid #fff0f5;box-shadow:0 2px 12px rgba(255,150,180,.08)}
.post-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.post-name{font-weight:700;font-size:13.5px;color:#ff6ea3}
.post-time{font-size:11px;color:#c5869f}
.post-content{font-size:14.5px;line-height:1.6;color:#3a2c32;word-break:break-word}
.post-actions{display:flex;gap:20px;font-size:14px;color:#c5869f;padding-top:10px;margin-top:10px;border-top:1px dashed #ffe4ee}
.post-actions i{cursor:pointer;transition:transform .2s}
.post-actions i:active{transform:scale(1.3)}
.post-actions .liked{color:#ff6ea3}

[contenteditable="true"]{outline:none;border-radius:6px;transition:background .2s;padding:1px 4px;margin:-1px -4px;cursor:text;border:1px dashed transparent;min-width:20px}
[contenteditable="true"]:hover{background:rgba(255,182,213,.22);border-color:rgba(255,150,180,.4)}
[contenteditable="true"]:focus{background:rgba(255,182,213,.3);border-color:#ff6ea3;box-shadow:0 0 0 3px rgba(255,110,163,.12)}

#fileAvatar{display:none}

.chat-overlay{position:fixed;inset:0;background:#fff;z-index:1000;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-width:480px;margin:0 auto;left:0;right:0}
.chat-overlay.open{transform:translateX(0)}

.chat-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #fff0f5;background:#fff;flex-shrink:0}
.chat-header .back{font-size:20px;color:#ff6ea3;cursor:pointer;padding:4px 8px}
.chat-header .chat-name{font-weight:700;font-size:15px;color:#8a3c5e}
.chat-header .chat-status{font-size:11px;color:#1cd14f;display:flex;align-items:center;gap:4px}
.chat-header .chat-status::before{content:'';width:6px;height:6px;background:#1cd14f;border-radius:50%}

.chat-body{flex:1;overflow-y:auto;padding:16px;background:linear-gradient(180deg,#fff5f9,#fff);display:flex;flex-direction:column;gap:12px}
.chat-body::-webkit-scrollbar{display:none}

.msg{display:flex;max-width:80%}
.msg.me{margin-left:auto;justify-content:flex-end}
.msg-bubble{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.45;word-break:break-word}
.msg.other .msg-bubble{background:#fff;color:#3a2c32;border:1px solid #ffe4ee;border-top-left-radius:4px}
.msg.me .msg-bubble{background:linear-gradient(135deg,#ff9ec4,#ff6ea3);color:#fff;border-top-right-radius:4px}

.chat-input{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid #fff0f5;background:#fff;flex-shrink:0}
.chat-input input{flex:1;border:none;background:#fff5f9;border-radius:22px;padding:11px 16px;font-size:14px;outline:none;color:#3a2c32}
.chat-input input::placeholder{color:#d4a5b8}
.chat-input button{background:linear-gradient(135deg,#ff9ec4,#ff6ea3);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(255,110,163,.3)}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(120px);background:#ff6ea3;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(255,110,163,.4);transition:transform .3s;z-index:2000;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="phone-container">
  <div class="top-bar">
    <div class="username">
      <i class="fas fa-chevron-left"></i>
      <span contenteditable="true">my_profile</span>
    </div>
    <div class="icons">
      <i class="fas fa-plus-square" onclick="toast('新建帖子')"></i>
      <i class="fas fa-paper-plane" onclick="sharePage()"></i>
    </div>
  </div>

  <div class="banner"></div>

  <div class="profile-section">
    <div class="avatar-container">
      <div class="avatar" onclick="document.getElementById('fileAvatar').click()">
        <img id="avatarImg" src="https://picsum.photos/id/1005/200/200" alt="">
        <div class="avatar-overlay"><i class="fas fa-camera"></i></div>
      </div>
    </div>
    <div class="profile-info">
      <div class="display-name">
        <span contenteditable="true">坏女孩 🎀</span>
        <i class="fas fa-circle-check"></i>
      </div>
      <div class="handle" contenteditable="true">@bad_girl</div>
      <div class="stats">
        <span><b contenteditable="true">128</b> 帖子</span>
        <span><b contenteditable="true">4.5K</b> 粉丝</span>
        <span><b contenteditable="true">892</b> 关注</span>
      </div>
    </div>
  </div>

  <div class="editable-bio">
    <div class="bio-text" contenteditable="true">
      ✨ 记录生活的小美好 · 只做自己<br>
      📍 上海 · 摄影 · 美食 · 深夜emo<br>
      💕 别太认真，开心就好
    </div>
  </div>

  <div class="doc-link-box">
    <i class="fas fa-file-alt"></i>
    <a href="#" contenteditable="true" onclick="event.preventDefault();toast('请修改为你的金山文档链接')">📄 点击查看我的资料文档（金山文档）</a>
  </div>

  <div class="action-buttons">
    <button class="btn" onclick="followMe(event)"><i class="fas fa-user-plus"></i> 关注</button>
    <button class="btn outline" onclick="openChat()"><i class="fas fa-comment-dots"></i> 消息</button>
    <button class="btn outline" onclick="sharePage()"><i class="fas fa-share-alt"></i> 分享</button>
  </div>

  <div class="section-title"><i class="fas fa-layer-group"></i> 最新动态</div>

  <div class="post">
    <div class="post-header">
      <div class="post-name" contenteditable="true">坏女孩 🎀</div>
      <div class="post-time" contenteditable="true">刚刚</div>
    </div>
    <div class="post-content" contenteditable="true">
      今天的晚霞超级好看 🌅 顺手拍了一张，好想跟人分享～
    </div>
    <div class="post-actions">
      <i class="far fa-heart" onclick="likePost(this)"></i>
      <i class="far fa-comment"></i>
      <i class="far fa-paper-plane"></i>
    </div>
  </div>

  <div class="post">
    <div class="post-header">
      <div class="post-name" contenteditable="true">坏女孩 🎀</div>
      <div class="post-time" contenteditable="true">3小时前</div>
    </div>
    <div class="post-content" contenteditable="true">
      下午茶时间 ☕️ 这家咖啡店真的绝了，环境好安静，适合发呆一整天
    </div>
    <div class="post-actions">
      <i class="far fa-heart" onclick="likePost(this)"></i>
      <i class="far fa-comment"></i>
      <i class="far fa-paper-plane"></i>
    </div>
  </div>

  <div class="post">
    <div class="post-header">
      <div class="post-name" contenteditable="true">坏女孩 🎀</div>
      <div class="post-time" contenteditable="true">昨天</div>
    </div>
    <div class="post-content" contenteditable="true">
      深夜emo模式开启 🌙 有时候真的想找个人聊聊天……
    </div>
    <div class="post-actions">
      <i class="far fa-heart" onclick="likePost(this)"></i>
      <i class="far fa-comment"></i>
      <i class="far fa-paper-plane"></i>
    </div>
  </div>
</div>

<div class="chat-overlay" id="chatOverlay">
  <div class="chat-header">
    <span class="back" onclick="closeChat()"><i class="fas fa-chevron-left"></i></span>
    <div>
      <div class="chat-name" contenteditable="true">坏女孩 🎀</div>
      <div class="chat-status">在线</div>
    </div>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-input">
    <input type="text" id="chatInput" placeholder="输入消息…" onkeydown="if(event.key==='Enter')sendMsg()">
    <button onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
  </div>
</div>

<input type="file" id="fileAvatar" accept="image/*">

<div class="toast" id="toast"></div>

<script>
document.getElementById('fileAvatar').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    document.getElementById('avatarImg').src = ev.target.result;
    toast('头像已更换 ✨');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

function likePost(el){
  el.classList.toggle('far');
  el.classList.toggle('fas');
  el.classList.toggle('liked');
}

let followed = false;
function followMe(e){
  followed = !followed;
  const btn = e.target.closest('.btn');
  if(followed){
    btn.innerHTML = '<i class="fas fa-check"></i> 已关注';
    btn.style.background = '#fff';
    btn.style.color = '#ff6ea3';
    btn.style.border = '1.5px solid #ffd6e5';
    toast('已关注 💕');
  }else{
    btn.innerHTML = '<i class="fas fa-user-plus"></i> 关注';
    btn.style.background = '';
    btn.style.color = '';
    btn.style.border = '';
    toast('已取消关注');
  }
}

function sharePage(){
  if(navigator.share){
    navigator.share({title:'我的主页',text:'来看看我的主页吧～',url:location.href}).catch(()=>{});
  }else{
    toast('长按网址复制分享给朋友吧～');
  }
}

const chatOverlay = document.getElementById('chatOverlay');
const chatBody = document.getElementById('chatBody');
let chatOpened = false;

function openChat(){
  chatOverlay.classList.add('open');
  if(!chatOpened){
    chatOpened = true;
    setTimeout(()=>{
      addMessage('me', '是坏女孩就把价格标上');
      setTimeout(()=>{
        addMessage('other', '50/h');
        setTimeout(()=>{
          addMessage('other', '要见我吗');
          setTimeout(()=>{
            addMessage('other', '今晚等你');
          }, 1000);
        }, 1000);
      }, 1200);
    }, 400);
  }
}

function closeChat(){
  chatOverlay.classList.remove('open');
}

function addMessage(who, text){
  const msg = document.createElement('div');
  msg.className = 'msg ' + who;
  msg.innerHTML = '<div class="msg-bubble">' + escapeHtml(text) + '</div>';
  chatBody.appendChild(msg);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function sendMsg(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  addMessage('me', text);
  input.value = '';
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
</script>
</body>
</html>
